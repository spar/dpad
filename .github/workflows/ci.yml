name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CI_RUNNER is an optional repository Actions variable. Set it to self-hosted
# (or the dockernext label) to use the runners from spar/gh-private-runners;
# leave it unset for GitHub's runners. See docs/self-hosted-runner.md.
jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        # Container runners are Linux; do not label those jobs as macOS tests.
        os: ${{ fromJSON(vars.CI_RUNNER != '' && '["self-hosted"]' || '["ubuntu-latest", "macos-latest"]') }}
        go: ["1.26.x", stable] # the minimum in go.mod, and the latest
    runs-on: ${{ vars.CI_RUNNER || matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: ${{ vars.CI_RUNNER == '' }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: ${{ vars.CI_RUNNER == '' }}
      - name: Test release scripts
        uses: actions/github-script@v8
        with:
          script: |
            require('node:child_process').execFileSync(process.execPath,
              ['--test', 'scripts/release/version.test.cjs', 'scripts/release/packages.test.cjs'], { stdio: 'inherit' })
      - run: make lint

  vuln:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: ${{ vars.CI_RUNNER == '' }}
      - run: make vuln

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, vuln]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.result }}
    concurrency:
      group: dpad-main-release
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine next version
        id: version
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: return require(process.cwd() + '/scripts/release/version.cjs').nextTag()
      - uses: actions/setup-go@v6
        if: steps.version.outputs.result != ''
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release assets
        if: steps.version.outputs.result != ''
        env:
          TAG: ${{ steps.version.outputs.result }}
        run: |
          assets=$(mktemp -d)
          echo "RELEASE_ASSETS=$assets" >> "$GITHUB_ENV"
          scripts/release/build.sh "$TAG" "$assets/dist"
      - name: Publish GitHub release
        if: steps.version.outputs.result != ''
        uses: actions/github-script@v8
        env:
          TAG: ${{ steps.version.outputs.result }}
        with:
          script: |
            const publish = require(process.cwd() + '/scripts/release/publish.cjs')
            await publish({ github, context, tag: process.env.TAG, dir: process.env.RELEASE_ASSETS + '/dist' })
      - name: Remove temporary release assets
        if: always() && env.RELEASE_ASSETS != ''
        run: rm -rf -- "$RELEASE_ASSETS"

  packages:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
