name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new advisories against unchanged code still fail CI

permissions:
  contents: read

# CI_RUNNER is an optional repository Actions variable. Set it to self-hosted
# (or the dockernext label) to use the runners from spar/gh-private-runners;
# leave it unset for GitHub's runners. See docs/self-hosted-runner.md.
jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        # Container runners are Linux; do not label those jobs as macOS tests.
        os: ${{ fromJSON(vars.CI_RUNNER != '' && '["self-hosted"]' || '["ubuntu-latest", "macos-latest"]') }}
        go: ["1.26.x", stable] # the minimum in go.mod, and the latest
    runs-on: ${{ vars.CI_RUNNER || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: ${{ vars.CI_RUNNER == '' }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  # Windows always runs on GitHub's runners; the self-hosted ones are Linux.
  test-windows:
    name: test (windows-latest, Go stable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: ${{ vars.CI_RUNNER == '' }}
      - name: Test release scripts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            require('node:child_process').execFileSync(process.execPath,
              ['--test', 'scripts/release/version.test.cjs', 'scripts/release/packages.test.cjs'], { stdio: 'inherit' })
      - run: make lint

  vuln:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The toolchain in go.mod is the one release builds use, so scan its standard library.
          go-version-file: go.mod
          cache: ${{ vars.CI_RUNNER == '' }}
      - run: make vuln

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, vuln]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.version.outputs.result }}
    concurrency:
      group: dpad-main-release
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine next version
        id: version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: return require(process.cwd() + '/scripts/release/version.cjs').nextTag()
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.version.outputs.result != ''
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release assets
        if: steps.version.outputs.result != ''
        env:
          TAG: ${{ steps.version.outputs.result }}
        run: |
          assets=$(mktemp -d)
          echo "RELEASE_ASSETS=$assets" >> "$GITHUB_ENV"
          scripts/release/build.sh "$TAG" "$assets/dist"
      - name: Attest build provenance
        if: steps.version.outputs.result != ''
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_ASSETS }}/dist/*
      # Shipping the signed bundle as an asset lets users verify offline and is
      # what Scorecard's Signed-Releases check looks for.
      - name: Add provenance bundle to release assets
        if: steps.version.outputs.result != ''
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" "$RELEASE_ASSETS/dist/dpad.sigstore.json"
      - name: Publish GitHub release
        if: steps.version.outputs.result != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.version.outputs.result }}
        with:
          script: |
            const publish = require(process.cwd() + '/scripts/release/publish.cjs')
            await publish({ github, context, tag: process.env.TAG, dir: process.env.RELEASE_ASSETS + '/dist' })
      - name: Remove temporary release assets
        if: always() && env.RELEASE_ASSETS != ''
        run: rm -rf -- "$RELEASE_ASSETS"

  packages:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
