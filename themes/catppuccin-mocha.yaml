name: catppuccin-mocha
description: Catppuccin Mocha's soft pastels on dark
author: dpad
source: https://catppuccin.com

terminal:
  background: "#1e1e2e"
  foreground: "#cdd6f4"

ui:
  brand: "#a6e3a1"
  dim: "#7f849c"
  header: "#89b4fa"
