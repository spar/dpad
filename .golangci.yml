version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - modernize
    - nilerr
    - unconvert
    - usestdlibvars
  exclusions:
    presets:
      - std-error-handling # unchecked Close, Remove, Print, Setenv, ...

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/spar/dpad
